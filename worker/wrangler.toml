name = "sigma-music-worker"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://sigmamusic.my.id,https://www.sigmamusic.my.id,https://sigma-music.vercel.app,http://localhost:3000"
OPENROUTER_MODEL = "openrouter/auto"
OPENROUTER_FALLBACK_MODEL = "google/gemini-2.0-flash-exp:free"
GEMINI_EMBED_MODEL = "text-embedding-004"
WA_NUMBER = "6285816686900"

[triggers]
crons = ["0 2 * * *"]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4f456d1e0690439682bf9f2bbf29353f"

[ai]
binding = "AI"
